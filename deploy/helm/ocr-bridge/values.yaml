# Default values for ocr-bridge.
#
# Secrets are never rendered from this file. Create them yourself (see the
# README) and point the `existingSecret` values at them.

nameOverride: ""
fullnameOverride: ""

image:
  receiver:
    repository: ghcr.io/hybridindie/ocr-receiver
    tag: "1.2.2"
    pullPolicy: IfNotPresent
  job:
    repository: ghcr.io/hybridindie/ocr-job
    tag: "1.13.10-r2"
    pullPolicy: IfNotPresent
  # Image pull secrets for private registries, e.g. [{name: ghcr-pull}]
  pullSecrets: []

receiver:
  replicas: 1
  port: 8080
  resources:
    requests:
      cpu: 50m
      memory: 64Mi
    limits:
      cpu: 500m
      memory: 256Mi
  serviceAccount:
    create: true
    name: ""
    annotations: {}
  podAnnotations: {}
  nodeSelector: {}
  tolerations: []
  affinity: {}
  securityContext:
    allowPrivilegeEscalation: false
    readOnlyRootFilesystem: true
    runAsNonRoot: true
    runAsUser: 1000
    capabilities:
      drop: ["ALL"]

job:
  # The Job pods get no Kubernetes API credentials.
  serviceAccount:
    name: ""
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      cpu: "1"
      memory: 2Gi
  deadlineSeconds: 3600
  ttlSecondsAfterFinished: 3600

providers:
  github:
    enabled: true
    # Secret keys: app-id, webhook-secret, private-key.pem
    existingSecret: ocr-app
  gitea:
    # Enable only after setting apiUrl and creating the ocr-gitea Secret;
    # the receiver treats a missing API URL as fatal for an enabled provider.
    enabled: false
    # In-cluster API base, e.g.
    # http://gitea-http.gitea.svc.cluster.local:3000/api/v1
    apiUrl: ""
    webUrl: ""
    # Gitea has no Bot user type; the login the token posts as. Used to scope
    # incremental dedupe. Leave empty to consider all review comments.
    botLogin: ""
    # Secret keys: token, webhook-secret
    existingSecret: ocr-gitea

llm:
  # Any OpenAI-compatible endpoint (vLLM, LiteLLM, MLflow gateway, Ollama).
  url: ""
  model: ""
  fallbackModel: ""
  protocol: openai
  useAnthropic: false
  timeout: 900
  # JSON object merged into each request, e.g. '{"thinking":{"type":"disabled"}}'
  extraBody: ""
  # Secret holding the gateway token.
  existingSecret: ocr-llm
  secretKey: token

policy:
  maxNits: 3
  incremental: true
  concurrency: 4
  language: English
  # Comma-separated globs that bypass OCR's extension allowlist, e.g.
  # "**/*.gd" for GDScript or "**/*.md" for docs. Empty by default.
  include: ""
  # Globs added to the base rule file's `exclude`, e.g. mirrored agent config
  # that produces every finding twice: "**/.claude/**,**/.opencode/**".
  exclude: ""
  # Review tuning. Empty = the CLI default, and the flag is not passed at all.
  #   effort           --effort low|medium|high (1/2/3 review rounds; default
  #                    medium). Token cost is roughly proportional.
  #   taskTimeout      --timeout, minutes per subtask (default 15, scaled by
  #                    effort). The LLM request timeout is llm.timeout.
  #   maxTokens        --max-tokens, prompt ceiling per subtask. Set it below
  #                    your model's context window (the CLI default is 200k).
  #   maxTokensBudget  --max-tokens-budget, total input+output cap per review.
  #                    Checked before every LLM round; over-budget files are
  #                    reported as failed(budget). A runaway guard: set it
  #                    above your largest normal review, e.g. "5000000".
  #   maxTools         --max-tools, tool-call rounds per subtask.
  effort: ""
  taskTimeout: ""
  maxTokens: ""
  maxTokensBudget: ""
  maxTools: ""
  commands: "/review,/ocr,/open-code-review"
  allowedAssociations: "OWNER,MEMBER,COLLABORATOR"

service:
  type: ClusterIP
  port: 8080

podMonitor:
  enabled: false
  labels:
    release: prometheus
  interval: 30s
  scrapeTimeout: 10s

ingress:
  enabled: false
  className: ""
  annotations: {}
  # hosts:
  #   - host: ocr.example.com
  #     paths:
  #       - path: /webhook
  #         pathType: Prefix
  hosts: []
  tls: []
