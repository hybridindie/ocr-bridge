{{- if .Values.receiver.serviceAccount.create }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "ocr-bridge.receiverServiceAccountName" . }}
  labels:
    {{- include "ocr-bridge.labels" . | nindent 4 }}
  {{- with .Values.receiver.serviceAccount.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
{{- end }}
