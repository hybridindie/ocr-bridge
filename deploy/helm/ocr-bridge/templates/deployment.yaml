apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "ocr-bridge.fullname" . }}
  labels:
    {{- include "ocr-bridge.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.receiver.replicas }}
  selector:
    matchLabels:
      {{- include "ocr-bridge.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "ocr-bridge.selectorLabels" . | nindent 8 }}
      {{- with .Values.receiver.podAnnotations }}
      annotations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
    spec:
      serviceAccountName: {{ include "ocr-bridge.receiverServiceAccountName" . }}
      {{- with .Values.image.pullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: receiver
          image: {{ printf "%s:%s" .Values.image.receiver.repository .Values.image.receiver.tag | quote }}
          imagePullPolicy: {{ .Values.image.receiver.pullPolicy }}
          ports:
            - name: http
              containerPort: {{ .Values.receiver.port }}
          envFrom:
            - configMapRef:
                name: {{ include "ocr-bridge.fullname" . }}
          env:
            {{- if .Values.providers.github.enabled }}
            - name: GITHUB_APP_ID
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.providers.github.existingSecret }}
                  key: app-id
                  optional: true
            - name: GITHUB_WEBHOOK_SECRET
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.providers.github.existingSecret }}
                  key: webhook-secret
                  optional: true
            - name: GITHUB_APP_PRIVATE_KEY_PATH
              value: /secrets/private-key.pem
            {{- end }}
            {{- if .Values.providers.gitea.enabled }}
            - name: GITEA_TOKEN
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.providers.gitea.existingSecret }}
                  key: token
                  optional: true
            - name: GITEA_WEBHOOK_SECRET
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.providers.gitea.existingSecret }}
                  key: webhook-secret
                  optional: true
            {{- end }}
            - name: NODE_EXTRA_CA_CERTS
              value: /var/run/secrets/kubernetes.io/serviceaccount/ca.crt
          volumeMounts:
            {{- if .Values.providers.github.enabled }}
            - name: github-app
              mountPath: /secrets
              readOnly: true
            {{- end }}
            - name: tmp
              mountPath: /tmp
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 2
            periodSeconds: 5
          resources:
            {{- toYaml .Values.receiver.resources | nindent 12 }}
          securityContext:
            {{- toYaml .Values.receiver.securityContext | nindent 12 }}
      volumes:
        {{- if .Values.providers.github.enabled }}
        - name: github-app
          secret:
            secretName: {{ .Values.providers.github.existingSecret }}
        {{- end }}
        - name: tmp
          emptyDir: {}
      {{- with .Values.receiver.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.receiver.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.receiver.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
